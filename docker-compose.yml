version: '3.8'

services:
  # 1. Database Service for Paperclip Dashboard
  postgres:
    image: postgres:15-alpine
    container_name: brenxia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: brenxia_db_pass_123
      POSTGRES_DB: paperclip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"

  # 2. BRENXIA Hermes Backend Agent Core (Python FastAPI)
  brenxia-agent:
    container_name: brenxia-agent
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./google_credentials.json:/app/google_credentials.json
      - ./google_chat_user_client_secret.json:/app/google_chat_user_client_secret.json
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
    driver: local
